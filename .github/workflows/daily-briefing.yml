name: Daily Market Briefing

# Triggered externally by cron-job.org at 07:00 Asia/Jakarta via the workflow
# dispatch API. GitHub's own `schedule:` was dropped because it ran up to ~2h45m
# late; the external trigger fires within a minute of the target time.
on:
  workflow_dispatch: {}

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python market_briefing.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # "미국지표" group. Not a secret — a chat id alone grants nothing
          # without the bot token, which stays in Actions secrets.
          TELEGRAM_CHAT_ID: "-5385031872"
