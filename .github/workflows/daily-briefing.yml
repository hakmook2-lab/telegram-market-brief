name: Daily Market Briefing

on:
  schedule:
    # Target delivery: 07:00-08:00 Jakarta. GitHub's scheduler runs late under load
    # (observed ~2h45m), so this fires at 05:00 Jakarta to absorb the drift.
    # US close is 03:00 Jakarta, so the previous close is always available by then.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python market_briefing.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
